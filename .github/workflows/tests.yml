name: tests

# Runs the full test suite on every push and pull request. No secrets are used and the token is read-only.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\run-tests.ps1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/last-results.md
          if-no-files-found: warn
