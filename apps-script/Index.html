<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<base target="_top">
<meta charset="utf-8">
<title>קול הסטודנטים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an indigo band with the course and week, then one column: chat + "my requests" for students, a tabbed board for course staff, a course list for the system admin */
:root {
  --bg: #F3F4F8; --surface: #FFFFFF; --fg: #151A29; --muted: #5A6278; --line: #DDE0EA;
  --accent: #4352D9; --accent-soft: #E6E8FB; --band: #1C2160; --band-fg: #EEF0FF; --band-muted: #A9B0E6;
  --signal: #19A88F; --high: #C63E2B; --med: #B4740F; --low: #2E7D5B; --danger: #B3261E;
  --display: "Rubik", "Assistant", system-ui, sans-serif;
  --body: "Assistant", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0F1220; --surface: #181C2E; --fg: #E8EAF4; --muted: #9CA3BD; --line: #2A3048;
  --accent: #8E9AFF; --accent-soft: #232A4D; --band: #151A45; --band-fg: #EEF0FF; --band-muted: #9CA5E0;
  --signal: #4FD1B8; --high: #F28B78; --med: #E8B550; --low: #7ACBA3; --danger: #F2827A; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.55; }
.gutter { padding-left: 16px; padding-right: 16px; }
.col { max-width: 820px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); }
h2 { font-size: 1.3rem; } h3 { font-size: 1.05rem; font-weight: 500; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: .8rem; }
[hidden] { display: none !important; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sent-to { font-size: 1.15em; font-weight: 700; text-align: center; padding: 10px; margin: 4px 0 8px; border: 1px dashed var(--accent); border-radius: 8px; background: var(--accent-soft); overflow-wrap: anywhere; }
.send-panel { margin-top: 10px; }
.send-panel .stack { margin-top: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }

/* Each area has its own colours on the same layout: students green, course staff amber, the system admin indigo. */
body.area-student { --accent: #0F7B6C; --accent-soft: #DDF3EF; --band: #0B4A41; --band-muted: #A6D9CF; }
body.area-staff { --accent: #A85A06; --accent-soft: #FBEBD3; --band: #4F3205; --band-muted: #EBCF9C; }
@media (prefers-color-scheme: dark) {
  body.area-student { --accent: #4FD1B8; --accent-soft: #123A35; --band: #0A3A33; --band-muted: #8FCFC2; }
  body.area-staff { --accent: #F0B25A; --accent-soft: #3A2A10; --band: #3A2504; --band-muted: #E3C38A; }
}
.area-icon { font-size: 2rem; line-height: 1; }
.google-note { border: 2px solid var(--accent); border-radius: 10px; padding: 12px 14px; background: var(--accent-soft); display: flex; flex-direction: column; gap: 4px; }
.google-note b { font-size: 1.05em; }
.connect-gate { border: 2px solid var(--accent); }
.badge { display: inline-block; min-width: 1.4em; padding: 0 6px; margin-inline-start: 6px; border-radius: 999px; background: var(--danger); color: #fff; font-size: .75rem; font-weight: 700; line-height: 1.5; text-align: center; }
.news-banner { border: 2px solid var(--danger); background: color-mix(in srgb, var(--danger) 8%, var(--surface)); animation: pop .4s ease-out; }
.news-banner h2 { color: var(--danger); }
@keyframes pop { from { transform: scale(.97); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .news-banner { animation: none; } }
.new-dot { color: var(--danger); font-weight: 700; font-size: .8rem; }
.item.is-new { border-inline-start: 4px solid var(--danger); }
.item.flagged { box-shadow: inset 0 0 0 2px var(--med); }
.student-group { display: flex; flex-direction: column; gap: 8px; }
.student-group > .spread { border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.announce .meta-line { color: var(--muted); font-size: .85rem; }
.announce .body { white-space: pre-wrap; overflow-wrap: anywhere; }
input[type=text], input[type=email], input[type=date], input[type=url], textarea, select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); min-width: 0; max-width: 100%; }
textarea { resize: vertical; }

.band { background: var(--band); color: var(--band-fg); padding-block: 26px 20px; }
.band .col { display: flex; flex-direction: column; gap: 8px; }
.kicker { color: var(--band-muted); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.kicker b { color: var(--band-fg); font-weight: 500; }
.band h1 span { color: var(--band-muted); font-weight: 500; }
.band p { color: var(--band-muted); max-width: 62ch; }
.dot { display: inline-block; width: .55em; height: .55em; border-radius: 50%; background: var(--signal); margin-inline-end: 6px; }
.userbar { display: flex; gap: 10px; align-items: center; margin-inline-start: auto; }
.userbar button { background: none; border: 0; color: var(--band-muted); text-decoration: underline; padding: 0; font-size: .8rem; }

.tabs-wrap { background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 12px 14px; color: var(--muted); border-bottom: 3px solid transparent; font-weight: 600; white-space: nowrap; }
.tabs button[aria-selected=true] { color: var(--fg); border-bottom-color: var(--accent); }

main { padding-block: 24px 48px; }
main .col { display: flex; flex-direction: column; gap: 22px; }
.block { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }

.btn { background: var(--accent); color: #fff; border: 1px solid var(--accent); border-radius: 10px; padding: 9px 16px; font-weight: 700; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: #fff; }
.btn.small { padding: 5px 12px; font-size: .9rem; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; font-size: .9rem; }
.link.danger { color: var(--danger); }
.status { font-size: .92rem; color: var(--muted); }
.status.warn { color: var(--med); font-weight: 600; }
.status.ok { color: var(--low); }
.spinner { display: inline-block; width: 1em; height: 1em; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

/* login */
.login { max-width: 460px; }
.login form { display: flex; flex-direction: column; gap: 10px; }
.login label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: .9rem; }
.code-input { font-family: var(--mono) !important; font-size: 1.4rem !important; letter-spacing: .3em; text-align: center; direction: ltr; }

/* chat */
.chat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
.chat-head { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: var(--muted); }
.log { padding: 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: 55vh; min-height: 220px; }
.msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.bot { background: var(--accent-soft); align-self: flex-start; border-start-start-radius: 4px; }
.msg.me { background: var(--accent); color: #fff; align-self: flex-end; border-start-end-radius: 4px; }
.msg .meta { display: block; font-family: var(--mono); font-size: .7rem; opacity: .8; margin-top: 3px; }
.divider { align-self: center; color: var(--muted); font-family: var(--mono); font-size: .75rem; }
.topics { display: flex; flex-wrap: wrap; gap: 6px; }
.topics button { background: var(--surface); color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 3px 12px; font-size: .88rem; }
.composer { border-top: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.composer-row { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; min-height: 48px; max-height: 180px; resize: none; border-radius: 10px; }
.attach { background: var(--bg); border: 1px solid var(--line); color: var(--fg); border-radius: 10px; padding: 9px 11px; display: inline-flex; }
.current { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .88rem; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 6px 10px; }
.current b { color: var(--fg); font-weight: 600; }
.who { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: .9rem; }
.who label { display: inline-flex; gap: 6px; align-items: center; }
.hint { display: flex; gap: 6px; align-items: center; font-size: .85rem; color: var(--muted); }
.files { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { display: inline-flex; gap: 6px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px 4px 2px 10px; font-size: .85rem; max-width: 100%; }
.fchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.fchip button { background: none; border: 0; color: var(--accent); padding: 2px 6px; font-size: .85rem; }
.preview { max-width: 100%; max-height: 320px; border-radius: 8px; border: 1px solid var(--line); align-self: flex-start; }
.updates { border-inline-start: 4px solid var(--signal); }
.updates ul { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 4px; }
.updates small, .item small { font-family: var(--mono); font-size: .72rem; color: var(--muted); }

/* requests */
.items { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.item h3 { font-size: 1.02rem; overflow-wrap: anywhere; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; font-family: var(--mono); font-size: .72rem; color: var(--muted); align-items: center; }
.tags span { border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; }
.meta-line { font-size: .82rem; color: var(--muted); }
.st { font-weight: 600; font-size: .78rem; padding: 1px 10px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.st.open { color: var(--muted); } .st.progress { color: var(--med); } .st.done { color: var(--low); }
.thread { display: flex; flex-direction: column; gap: 6px; border-inline-start: 2px solid var(--line); padding-inline-start: 10px; }
.tmsg { white-space: pre-wrap; overflow-wrap: anywhere; }
.tmsg.bot { color: var(--muted); font-size: .92rem; }
.tmsg small { display: block; }
.reply { background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.reply b { display: block; font-family: var(--mono); font-size: .72rem; font-weight: 500; color: var(--accent); }
.editor { display: flex; flex-direction: column; gap: 8px; background: var(--bg); border-radius: 10px; padding: 10px; }
.editor textarea { background: var(--surface); min-height: 64px; }
.item.past { opacity: .7; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { background: var(--surface); border: 1px solid var(--line); color: var(--fg); border-radius: 999px; padding: 4px 12px; font-size: .9rem; }
.filters button[aria-pressed=true] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.filters b { font-family: var(--mono); font-weight: 500; font-size: .8rem; margin-inline-start: 4px; opacity: .8; }

/* board */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.stat b { display: block; font-family: var(--display); font-weight: 500; font-size: 1.8rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: .85rem; color: var(--muted); }
.stat.alert b { color: var(--med); }
.weeks { display: flex; align-items: flex-end; gap: 6px; height: 96px; }
.wk { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; }
.wk i { display: block; width: 100%; max-width: 28px; background: var(--line); border-radius: 4px 4px 0 0; min-height: 2px; }
.wk.has i { background: var(--accent); } .wk.now i { background: var(--signal); }
.wk span, .wk em { font-family: var(--mono); font-size: .68rem; color: var(--muted); font-style: normal; }
.themes { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.theme { padding: 16px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); gap: 4px 12px; }
.rank { font-family: var(--mono); color: var(--muted); padding-top: 2px; }
.theme-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.chip { font-size: .75rem; font-weight: 700; padding: 1px 10px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.chip.high { color: var(--high); } .chip.medium { color: var(--med); } .chip.low { color: var(--low); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
blockquote { margin: 0; padding-inline-start: 12px; border-inline-start: 3px solid var(--line); color: var(--muted); font-size: .95rem; }
.rec { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; }
.rec b { display: block; font-family: var(--mono); font-size: .72rem; font-weight: 500; color: var(--accent); }
.lists { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.lists ul, .plain { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 4px; }
.plain.bare { list-style: none; padding: 0; gap: 10px; }
.plain.bare li { border-bottom: 1px solid var(--line); padding-bottom: 10px; display: flex; flex-direction: column; gap: 4px; overflow-wrap: anywhere; }
.linkbox { display: flex; gap: 8px; }
.linkbox input { flex: 1; direction: ltr; font-family: var(--mono); font-size: .8rem; }
.form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; }
.form-grid label, .stack label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.confirm { border-color: var(--danger); }
.courses { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

/* orientation / welcome */
.welcome { border-inline-start: 4px solid var(--accent); gap: 6px; }
.welcome.student { border-inline-start-color: var(--signal); }
.welcome.staff { border-inline-start-color: var(--med); }
.welcome.admin { border-inline-start-color: var(--accent); }
.welcome h2 { font-size: 1.35rem; }
.welcome .who-line { font-size: .85rem; color: var(--muted); }
.welcome .note { font-size: .92rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 6px; }
.welcome .note.warn { color: var(--med); font-weight: 600; }
.area-chip { align-self: flex-start; font-size: .8rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; color: #fff; background: var(--accent); }
.welcome.student .area-chip { background: var(--signal); color: #06231d; }
.welcome.staff .area-chip { background: var(--med); color: #2a1a00; }
.userbar .role { color: var(--band-fg); }

@media (max-width: 620px) {
  .stats, .courses { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .courses, .lists, .form-grid { grid-template-columns: 1fr; }
  .msg { max-width: 92%; }
}
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
</head>
<body>
<header class="band gutter">
  <div class="col">
    <div class="kicker mono">
      <span id="weekLabel" hidden><span class="dot"></span><b></b></span>
      <span id="orgLabel"></span><span id="startLabel"></span>
      <span class="userbar"><span id="whoami"></span><button id="nameBtn" type="button" hidden>הפרופיל שלי</button><button id="logoutBtn" type="button" hidden>יציאה</button></span>
    </div>
    <h1>קול הסטודנטים<span id="titleCourse"></span></h1>
    <p id="bandText">מקום אחד לכל מה שהייתם משנים בקורס: ההרצאות, התרגולים, הכלים, הליווי המנהלתי וכל השאר.</p>
  </div>
</header>
<div class="tabs-wrap gutter" id="tabsWrap" hidden><nav class="tabs col" id="tabs" role="tablist"></nav></div>
<main class="gutter"><div class="col" id="app"><p class="muted"><span class="spinner"></span> טוען…</p></div></main>

<script>
(function () {
  'use strict';
  var CATS = { teaching: 'הוראה והרצאות', content: 'תוכן ותרגולים', tools: 'כלים טכניים', admin: 'ליווי מנהלתי', logistics: 'לוגיסטיקה ותקשורת', general: 'כללי' };
  var OWNERS = { lecturer: 'מרצה', admin: 'מנהלת הקורס', tech: 'צוות טכני', management: 'הנהלת התוכנית' };
  var STATUS = { open: 'ממתין לטיפול', progress: 'בטיפול', done: 'טופל' };
  var SEV = { high: 'דחוף', medium: 'בינוני', low: 'קל' }, SEVN = { high: 3, medium: 2, low: 1 };
  var TOPICS = ['ההרצאות', 'התרגולים והמטלות', 'הכלים והפלטפורמות', 'הליווי המנהלתי', 'תקשורת ולוחות זמנים'];
  var MAX_FILES = 3, MAX_BYTES = 5 * 1024 * 1024;

  var S = { token: null, email: '', params: {}, boot: null, courseId: '', view: '', tab: '',
    currentItem: null, pending: [], mine: null, board: null, share: null, statusFilter: 'open', cat: 'all',
    openTheme: null, drafts: {}, history: [] };

  // ---------- helpers ----------
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function btn(cls, text, fn) { var b = el('button', cls, text); b.type = 'button'; if (fn) b.onclick = fn; return b; }
  function fmt(iso) { try { return new Date(iso).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', year: '2-digit', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
  function fmtDay(ymd) { var p = String(ymd || '').split('-'); return p.length === 3 ? +p[2] + '.' + +p[1] + '.' + p[0] : ''; }
  function kb(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function weekOf(t, start) { if (!start) return 0; return Math.floor((t - new Date(start + 'T00:00:00').getTime()) / (7 * 864e5)) + 1; }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  function today() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function errText(e) { return String(e && e.message || e || 'שגיאה').replace(/^(Exception|Error):\s*/, ''); }

  function api(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        if (errText(e) === 'AUTH') { signOutLocal(); render(); }
        reject(e);
      });
      r[fn].apply(r, args);
    });
  }

  function draftArea(id, placeholder) {
    var ta = el('textarea'); ta.id = id; ta.placeholder = placeholder || ''; ta.value = S.drafts[id] || '';
    ta.oninput = function () { S.drafts[id] = ta.value; };
    return ta;
  }

  function linkBox(url) {
    var w = el('div', 'linkbox');
    var i = el('input'); i.type = 'url'; i.readOnly = true; i.value = url; i.setAttribute('aria-label', 'קישור');
    var b = btn('btn ghost small', 'העתקה', function () {
      i.select();
      var ok = false;

      if (S.pending.length >= MAX_FILES) { chatStatus('אפשר לצרף עד ' + MAX_FILES + ' קבצים להודעה.', 'warn'); return Promise.resolve(); }
      return prepareFile(f).then(function (p) {
        if (p.size > MAX_BYTES) { chatStatus('הקובץ "' + f.name + '" גדול מ-5MB.', 'warn'); return; }
        if (S.pending.length < MAX_FILES) S.pending.push(p);
      }, function () { chatStatus('לא הצלחנו לקרוא את "' + f.name + '".', 'warn'); });
    });
    Promise.all(jobs).then(renderPending);
  }
  function prepareFile(f) {
    function toB64(blob, name, type) {
      return new Promise(function (res, rej) {
        var r = new FileReader();
        r.onload = function () { res({ name: name, type: type, size: blob.size, data: String(r.result).split(',')[1] || '' }); };
        r.onerror = rej; r.readAsDataURL(blob);
      });
    }
    var type = f.type || 'application/octet-stream';
    if (/^image\/(png|jpeg|webp)$/.test(type) && f.size > 900 * 1024 && window.createImageBitmap) {
      return createImageBitmap(f).then(function (bmp) {
        var scale = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
        var c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
        c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
        return new Promise(function (res) { c.toBlob(res, 'image/jpeg', 0.85); });
      }).then(function (out) {
        if (out && out.size < f.size) return toB64(out, f.name.replace(/\.[^.]+$/, '') + '.jpg', 'image/jpeg');
        return toB64(f, f.name, type);
      });
    }
    return toB64(f, f.name, type);
  }

  // ---------- exports ----------
  function csv(items) {
    function q(s) { s = String(s == null ? '' : s); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; }
    var rows = [['תאריך', 'עדכון אחרון', 'פונה', 'תחום', 'סיכום', 'דברי הסטודנט', 'קבצים', 'סטטוס', 'מענה'].map(q).join(',')];
    items.forEach(function (it) {
      rows.push([fmt(it.createdAt), fmt(it.updatedAt), whoLabel(it), CATS[it.category] || '', it.summary,
        it.messages.filter(function (m) { return m.role === 'student'; }).map(function (m) { return m.text; }).join(' | '),
        it.files.map(function (f) { return f.name; }).join(' | '), STATUS[it.status], it.replies.map(function (r) { return r.text; }).filter(Boolean).join(' | ')].map(q).join(','));
    });
    return '﻿' + rows.join('\r\n');
  }

  function reportHtml(course, items, rep, actions, label) {
    actions = actions || [];
    var themes = rep ? sortThemes(rep.themes).map(function (t, i) {
      var done = actions.filter(function (a) { return a.theme === t.title; }).map(function (a) { return '<li>[' + STATUS[a.status] + '] ' + esc(a.text) + '</li>'; }).join('');
      return '<section><h3>' + (i + 1) + '. ' + esc(t.title) + ' <small>(' + CATS[t.category] + ' · באחריות ' + (OWNERS[t.owner] || '') + ' · ' + SEV[t.severity] + ' · ' + t.students + '/' + rep.students + ' פונים)</small></h3>' +
        (t.quotes || []).map(function (q) { return '<blockquote>״' + esc(q) + '״</blockquote>'; }).join('') + '<p><b>המלצה:</b> ' + esc(t.recommendation) + '</p>' + (done ? '<p><b>מענה בפועל:</b></p><ul>' + done + '</ul>' : '') + '</section>';
    }).join('') : '<p>לא הופק ניתוח לתקופה הזו.</p>';
    function list(a) { return a && a.length ? '<ul>' + a.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '<p>אין</p>'; }
    var rows = items.map(function (it) {
      return '<tr><td>' + esc(fmt(it.createdAt)) + '</td><td>' + esc(whoLabel(it)) + '</td><td><b>' + esc(it.summary) + '</b><br>' +
        it.messages.filter(function (m) { return m.role === 'student'; }).map(function (m) { return esc(m.text); }).join('<br>') + '</td><td>' + STATUS[it.status] + '</td><td>' +
        it.replies.filter(function (r) { return r.text; }).map(function (r) { return esc(r.text); }).join('<br>') + '</td></tr>';
    }).join('');
    return '<!doctype html><html dir="rtl" lang="he"><head><meta charset="utf-8"><title>' + esc(course.name) + ' · משוב סטודנטים</title>' +
      '<style>body{font-family:Arial,sans-serif;max-width:920px;margin:32px auto;padding:0 16px;line-height:1.6;color:#151A29}small{color:#5A6278;font-weight:400}blockquote{margin:6px 0;padding-right:10px;border-right:3px solid #DDE0EA;color:#5A6278}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid #DDE0EA;padding:6px;text-align:right;vertical-align:top}</style></head><body>' +
      '<h1>משוב סטודנטים · ' + esc(course.name) + '</h1><p><small>' + esc(course.org || '') + (course.start ? ' · נפתח ' + fmtDay(course.start) : '') + ' · ' + esc(label || 'הופק ' + fmt(new Date().toISOString())) + '</small></p>' +
      '<h2>תמונת מצב</h2><p>' + (rep ? esc(rep.summary) : '') + '</p><h2>מה לשפר, לפי סדר עדיפות</h2>' + themes +
      '<h2>צעדים מהירים</h2>' + list(rep && rep.quickWins) + '<h2>מה כן עובד</h2>' + list(rep && rep.strengths) +
      '<h2>כל הפניות (' + items.length + ')</h2><table><tr><th>תאריך</th><th>פונה</th><th>פנייה</th><th>סטטוס</th><th>מענה</th></tr>' + rows + '</table></body></html>';
  }

    $('bandText').textContent = 'ניהול מערכת: כל הקורסים, הקישורים שלהם ואנשי ההנהלה.';
    loading();
    api('adminOverview', S.token).then(function (o) {
      var root = document.createDocumentFragment();
      var open = o.courses.reduce(function (n, c) { return n + c.open; }, 0);
      root.appendChild(welcomeCard('admin', hello(),
        'הגעת לאזור המנהל של קול הסטודנטים. מכאן מנהלים את כל הקורסים: יצירה ומחיקה, אנשי הנהלה, וכניסה לכל לוח. הגישה לכאן שמורה למנהלי המערכת בלבד.',
        'מחובר/ת כ-' + S.email + ' · מנהל/ת מערכת',
        [{ text: o.courses.length + ' קורסים במערכת · ' + (open ? open + ' פניות ממתינות למענה' : 'אין פניות שממתינות למענה') + '.' },
          o.requests.length ? { warn: true, text: o.requests.length + ' בקשות הרשאה ממתינות לאישור שלך. הן מופיעות כאן למטה.' } : null]));
      if (o.requests.length) {
        var rq = el('section', 'block');
        rq.appendChild(el('h2', null, 'בקשות הרשאה'));
        rq.appendChild(el('p', 'muted', 'הנהלת קורס: רק מי שתאשר יקבל גישה ללוח הקורס. פתיחת קורסים חדשים: מי שתאשר יוכל לפתוח קורסים בעצמו. המבקש יקבל מייל על ההחלטה.'));
        o.requests.forEach(function (r) {
          var card = el('article', 'card');
          card.appendChild(el('h3', null, (r.name || r.email) + ' · ' + r.courseName));
          card.appendChild(el('span', 'mono muted', r.email + ' · ' + fmt(r.createdAt)));
          if (r.note) card.appendChild(el('blockquote', null, r.note));
          var row = el('div', 'row'), st = el('span', 'status');
          function decide(approve) {
            return function (ev) {
              Array.prototype.forEach.call(row.querySelectorAll('button'), function (x) { x.disabled = true; });
              api('decideStaffRequest', S.token, r.id, approve).then(function () {
                S.flash = !approve ? 'הבקשה של ' + (r.name || r.email) + ' נדחתה.'
                  : r.kind === 'create' ? (r.name || r.email) + ' קיבל/ה הרשאה לפתוח קורסים.' : (r.name || r.email) + ' אושר/ה כהנהלת הקורס ' + r.courseName + '.';
                renderAdmin();
              }, function (e) { st.className = 'status warn'; st.textContent = errText(e); Array.prototype.forEach.call(row.querySelectorAll('button'), function (x) { x.disabled = false; }); });
            };
          }
          row.append(btn('btn small', 'אישור', decide(true)), btn('btn danger small', 'דחייה', decide(false)), st);
          card.appendChild(row);
          rq.appendChild(card);
        });
        root.appendChild(rq);
      }
      var links = el('section', 'card');
      links.append(el('h2', null, 'הקישורים הקבועים'),
        el('p', 'muted', 'שלושה קישורים לכל המערכת. הם לא משתנים כשיוצרים או מוחקים קורסים. כל אחד נכנס עם המייל שלו ומגיע לקורס שלו, או בוחר מרשימה אם יש לו כמה.'),
        el('h3', null, 'לסטודנטים'), linkBox(o.links.student),
        el('h3', null, 'לאנשי הנהלת הקורס'), linkBox(o.links.staff),
        el('p', 'mono muted', 'מי שעוד לא אושר בוחר את הקורס שלו ושולח בקשת הרשאה. הבקשה מופיעה כאן לאישור.'),
        el('h3', null, 'למנהל המערכת (הדף הזה)'), linkBox(o.links.admin));
      root.appendChild(links);
      var head = el('div', 'spread'); head.append(el('h2', null, 'כל הקורסים'), el('span', 'mono muted', 'מנהלי מערכת: ' + o.admins.join(', ')));
      root.appendChild(head);
      if (S.flash) { root.appendChild(el('p', 'card status ok', S.flash)); S.flash = ''; }
      var grid = el('div', 'courses');
      if (!o.courses.length) grid.appendChild(el('p', 'muted', 'עוד אין קורסים. צרו את הראשון למטה.'));
      o.courses.forEach(function (c) {
        var card = el('article', 'card');
        card.append(el('h3', null, c.name), el('span', 'mono muted', [c.org, c.start ? 'נפתח ' + fmtDay(c.start) : ''].filter(Boolean).join(' · ')));
        var tags = el('div', 'tags'); tags.append(el('span', null, c.items + ' פניות'), el('span', null, c.open + ' ממתינות'), el('span', null, c.students + ' סטודנטים'), el('span', null, c.staff + ' אנשי הנהלה'), el('span', null, c.last ? 'פעילות אחרונה ' + fmt(c.last) : 'אין פעילות'));
        card.appendChild(tags);
        if (c.pendingRequests) card.appendChild(el('span', 'st progress', c.pendingRequests + ' בקשות הרשאה ממתינות לאישור'));
        var r = el('div', 'row');
        r.append(btn('btn small', 'ללוח הקורס', function () { openCourse(c.id, 'staff'); }),
          btn('btn ghost small', 'משתמשים והרשאות', function () { openCourse(c.id, 'staff', 'users'); }),
          btn('btn ghost small', 'שיתוף', function () { openCourse(c.id, 'staff', 'share'); }));
        var delOpen = btn('link danger', 'מחיקת הקורס', function () { delBox.hidden = false; delOpen.hidden = true; delBox.querySelector('input').focus(); });
        r.appendChild(delOpen);
        card.appendChild(r);
        // Deleting needs the course name typed back; the server checks it again.
        var delBox = el('div', 'editor'); delBox.hidden = true;
        delBox.appendChild(el('p', null, 'המחיקה מוחקת את הקורס, את כל הפניות, המענים והעותקים שלו, ואת רשימות ההנהלה והמשתתפים. לפני המחיקה נשמר גיבוי מלא ב-Drive, והקבצים שצורפו עוברים לפח של Drive.'));
        var lab = el('label', 'mono muted', 'כדי לאשר, הקלידו את שם הקורס: ' + c.name);
        var inp = el('input'); inp.type = 'text'; inp.id = 'del_' + c.id; lab.htmlFor = inp.id;
        delBox.append(lab, inp);
        var dr = el('div', 'row'), dst = el('span', 'status');
        var go = btn('btn danger solid small', 'מחיקה לצמיתות', function () {
          go.disabled = true; dst.className = 'status'; dst.textContent = 'מוחק…';
          api('deleteCourse', S.token, c.id, inp.value).then(function (res) { S.flash = 'הקורס "' + c.name + '" נמחק. הגיבוי נשמר ב-Drive בשם: ' + res.backup; renderAdmin(); },
            function (e) { go.disabled = false; dst.className = 'status warn'; dst.textContent = errText(e); });
        });
        go.disabled = true;
        inp.oninput = function () { go.disabled = inp.value.trim() !== c.name; };
        dr.append(go, btn('btn ghost small', 'ביטול', function () { delBox.hidden = true; delOpen.hidden = false; inp.value = ''; go.disabled = true; }), dst);
        delBox.appendChild(dr);
        card.appendChild(delBox);
        grid.appendChild(card);
      });
      root.appendChild(grid);

      root.appendChild(newCourseCard('קורס חדש'));
      app().replaceChildren(root);
    }, fail);
  }

  /** For someone with no course yet (even when there are no courses at all): ask the admin for permission to open courses. */
  function creatorCard(b) {
    var c = el('section', 'card'); c.id = 'creatorCard';
    c.appendChild(el('h2', null, 'פתיחת קורסים חדשים'));
    var r = b.creatorRequest;
    if (r && r.status === 'pending') {
      c.appendChild(el('p', 'status warn', 'הבקשה שלך לפתוח קורסים ממתינה לאישור מנהל המערכת (נשלחה ' + fmt(r.createdAt) + '). אחרי האישור יופיע כאן טופס לפתיחת קורס.'));
      return c;
    }
    c.appendChild(el('p', 'muted', (r && r.status === 'rejected' ? 'הבקשה הקודמת שלך לא אושרה. אפשר לשלוח בקשה חדשה. ' : '') +
      'כדי לפתוח קורסים בעצמך, שלחו בקשה למנהל המערכת. אחרי שיאשר, תוכלו לפתוח קורסים, גם אם עוד אין אף קורס במערכת.'));
    var ta = el('textarea'); ta.rows = 2; ta.maxLength = 300; ta.placeholder = 'לא חובה: מי את/ה ואיזה קורס תרצו לפתוח';
    var st = el('p', 'status');
    c.append(field('הסבר קצר', ta), btn('btn', 'בקשת הרשאה לפתוח קורסים', function (ev) {
      var bt = ev.currentTarget; bt.disabled = true;
      api('requestCreatorAccess', S.token, ta.value).then(function () { S.boot = null; render(); },
        function (e) { bt.disabled = false; st.className = 'status warn'; st.textContent = errText(e); });
    }), st);
    return c;
  }

  /** New course form, for the admin page and for staff in "my courses". The new course opens on its share tab. */
  function newCourseCard(title, text) {
    var add = el('section', 'card');
    add.appendChild(el('h2', null, title));
    if (text) add.appendChild(el('p', 'muted', text));
    var g = el('div', 'form-grid');
    g.innerHTML = '<label>שם הקורס<input type="text" id="nName" maxlength="80" required></label><label>מוסד<input type="text" id="nOrg" maxlength="80"></label><label>תאריך פתיחה<input type="date" id="nStart"></label>';
    add.appendChild(g);
    var st = el('p', 'status');
    add.appendChild(btn('btn', 'יצירת קורס', function (ev) {
      var b = ev.currentTarget; b.disabled = true;
      api('createCourse', S.token, { name: $('nName').value, org: $('nOrg').value, start: $('nStart').value }).then(function (c) { openCourse(c.id, 'staff', 'share'); }, function (e) { b.disabled = false; st.className = 'status warn'; st.textContent = errText(e); });
    }));
    add.appendChild(st);
    return add;
  }

  /**
   * Behind the permanent links (?view=student, ?view=staff): one course opens straight away, several are listed.
   * Someone with no staff access sees every course and can ask for access to theirs.
   */
  function renderPicker() {
    var b = S.boot, mode = pickerMode(), list = choices(mode);
    if (list.length === 1 && !S.picked && !S.flash) return openCourse(list[0].id, mode === 'staff' ? 'staff' : '');
    S.picked = true;
    setTabs([]); setBand(null);
    var root = el('section', 'block'), notes = [];
    if (S.flash) { notes.push({ warn: true, text: S.flash }); S.flash = ''; }
    var who = 'מחובר/ת כ-' + S.email;
    if (mode === 'staff') {
      $('bandText').textContent = 'אזור הנהלת הקורס: בחרו את הקורס שלכם.';
      root.appendChild(welcomeCard('staff', hello(), list.length
        ? 'אלה הקורסים שיש לך גישה ללוח ההנהלה שלהם. בחרו לאן להיכנס.'
        : b.canCreate ? 'אפשר לפתוח כאן את הקורס הראשון שלך.'
        : 'למייל הזה עוד אין גישה ללוח הנהלה של אף קורס. אפשר לבקש הרשאה לקורס קיים מהרשימה למטה, או לבקש הרשאה לפתוח קורסים בעצמך. מנהל המערכת יאשר, ותקבלו על כך מייל.', who, notes));
      list.forEach(function (c) { root.appendChild(courseRow(c, 'ללוח הקורס', function () { openCourse(c.id, 'staff'); })); });
      if (list.length && !b.admin) root.appendChild(newCourseCard('פתיחת קורס חדש', 'הקורס ייפתח עם כל הלשוניות, ואת/ה תהיה/י בהנהלת הקורס שלו. מנהל המערכת יקבל על כך הודעה.'));
      if (!list.length && !b.admin) root.appendChild(b.canCreate
        ? newCourseCard('פתיחת קורס חדש', 'מנהל המערכת אישר לך לפתוח קורסים. הקורס ייפתח עם כל הלשוניות, ואת/ה תהיה/י בהנהלת הקורס שלו.')
        : creatorCard(b));
      var mine = {}; list.forEach(function (c) { mine[c.id] = 1; });
      var others = b.courses.filter(function (c) { return !mine[c.id]; });
      if (others.length) {
        root.appendChild(el('h2', null, list.length ? 'בקשת גישה לקורס נוסף' : 'בקשת הרשאה להנהלת קורס'));
        others.forEach(function (c) { root.appendChild(courseRow(c, 'לבקשת הרשאה', function () { openCourse(c.id, 'staff'); }, true)); });
      } else if (!list.length) root.appendChild(el('p', 'muted', 'עוד אין קורסים במערכת.'));
      if (b.studentCourses.length) root.appendChild(btn('btn ghost small', 'לאזור הסטודנטים', function () { openCourse('', 'student'); }));
    } else {
      $('bandText').textContent = 'מקום אחד לכל מה שהייתם משנים בקורס: ההרצאות, התרגולים, הכלים, הליווי המנהלתי וכל השאר.';
      root.appendChild(welcomeCard('student', hello(), list.length
        ? 'בחרו את הקורס שעליו תרצו לכתוב משוב. אפשר לכתוב בעילום שם, ולעקוב אחרי המענה לכל פנייה.'
        : 'עוד אין קורס פתוח למייל הזה. אם הקורס שלכם מוגבל לרשימת משתתפים, בקשו מהנהלת הקורס להוסיף את המייל שלכם.', who, notes));
      list.forEach(function (c) { root.appendChild(courseRow(c, 'לצ\'אט המשוב', function () { openCourse(c.id, ''); })); });
      if (b.staffCourses.length) root.appendChild(btn('btn ghost small', 'לאזור הנהלת הקורס', function () { openCourse('', 'staff'); }));
    }
    app().replaceChildren(root);
  }
  function courseRow(c, label, go, ghost) {
    var card = el('div', 'card spread'), t = el('div');
    var nm = el('b', null, c.name); if (c.fresh) nm.appendChild(el('span', 'badge', c.fresh + ' חדש'));
    t.append(nm, el('span', 'mono muted', [c.org, c.start ? 'נפתח ' + fmtDay(c.start) : ''].filter(Boolean).join(' · ')));
    t.style.display = 'flex'; t.style.flexDirection = 'column';
    card.append(t, btn(ghost ? 'btn ghost small' : 'btn small', label, go));
    return card;
  }

  // =====================================================================
  // Start
  // =====================================================================
  // Opened straight from the project folder instead of through Google: say so instead of spinning forever.
  if (typeof google === 'undefined' || !google.script || !google.script.run) {
    var note = el('section', 'card');
    note.append(el('h2', null, 'זה קובץ המקור, לא האפליקציה'),
      el('p', null, 'הקובץ הזה מודבק בפרויקט ב-Google ועובד רק משם. כדי לפתוח את המערכת, פתחו את הקובץ "קישורים.html" בתיקיית הפרויקט.'));
    app().replaceChildren(note);
    return;
  }
  S.token = store('sv-token');
  S.email = store('sv-email') || '';
  google.script.url.getLocation(function (loc) {
    var p = loc.parameter || {};
    S.courseId = p.course || '';
    S.view = p.view === 'staff' || p.view === 'student' ? p.view : '';
    render();
  });
})();
</script>
</body>
</html>
